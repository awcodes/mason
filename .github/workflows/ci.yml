name: CI

on:
  push:
    branches:
      - 3.x
    paths:
      - "src/**"
      - "config/**"
      - "database/**"
      - "resources/**"
      - "routes/**"
      - "tests/**"
      - "workbench/**"
      - "composer.json"
      - "composer.lock"
      - "package.json"
      - "package-lock.json"
      - "vite.config.*"
      - "phpunit.xml*"
      - "phpstan.neon*"
      - "rector.php"
      - "pint.json"
      - ".github/workflows/**"
  pull_request:
    branches:
      - 3.x
    paths:
      - "src/**"
      - "config/**"
      - "database/**"
      - "resources/**"
      - "routes/**"
      - "tests/**"
      - "workbench/**"
      - "composer.json"
      - "composer.lock"
      - "package.json"
      - "package-lock.json"
      - "vite.config.*"
      - "phpunit.xml*"
      - "phpstan.neon*"
      - "rector.php"
      - "pint.json"
      - ".github/workflows/**"

# 3.x serves both Filament majors from one branch, so one caller covers both: the
# matrix pins filament/filament per row and the shared workflow installs it before
# running the suite. main (Filament 3), 2.x and 1.x are frozen legacy branches.
jobs:
  ci:
    uses: awcodes/.github/.github/workflows/filament-plugin.yml@v1
    with:
      # All seven rows were resolved locally before being committed. The two Laravel 13
      # rows only became possible once orchestra/testbench was widened to allow ^11.0.
      matrix: |
        [
          {"php":"8.5","laravel":"13.*","filament":"5.*","testbench":"11.*","dependencies":"prefer-stable"},
          {"php":"8.4","laravel":"13.*","filament":"5.*","testbench":"11.*","dependencies":"prefer-stable"},
          {"php":"8.5","laravel":"12.*","filament":"5.*","testbench":"10.*","dependencies":"prefer-stable"},
          {"php":"8.4","laravel":"12.*","filament":"5.*","testbench":"10.*","dependencies":"prefer-stable"},
          {"php":"8.3","laravel":"12.*","filament":"5.*","testbench":"10.*","dependencies":"prefer-stable"},
          {"php":"8.4","laravel":"12.*","filament":"4.*","testbench":"10.*","dependencies":"prefer-stable"},
          {"php":"8.3","laravel":"12.*","filament":"4.*","testbench":"10.*","dependencies":"prefer-stable"}
        ]
      run-tests: true
      run-lint: true
      run-static-analysis: true
      run-reformat: true
      # The suite does not need a fresh build: resources/dist is committed, so the
      # bundles the service provider registers are already in the checkout, and the
      # tests assert rendered markup rather than bundle contents. Freshness is the
      # `assets` job's problem, below.
      run-build: false

  # resources/dist is committed and shipped, so a change to resources/js that lands
  # without a rebuild silently publishes stale assets. The esbuild build is
  # deterministic, so rebuilding and diffing catches that on the PR rather than after
  # a tag is cut. (The shared workflow's run-build input is a different thing: it
  # builds assets for suites that need them, and checks nothing.)
  #
  # Only the root resources/dist counts. workbench/resources/dist holds the local demo
  # app's Tailwind theme, built by the separate `build:workbench` script, and is not
  # shipped to consumers.
  assets:
    name: Assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Check that dist is current
        run: |
          if [ -n "$(git status --porcelain -- resources/dist)" ]; then
            echo "::error::resources/dist is out of date. Run 'npm run build' and commit the result."
            git --no-pager diff --stat -- resources/dist
            git status --porcelain -- resources/dist
            exit 1
          fi
